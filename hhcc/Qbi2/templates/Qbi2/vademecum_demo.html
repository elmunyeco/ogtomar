<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo vademecum QBI2 cache</title>
  <style>
    :root {
      --border: #d7dde5;
      --ink: #1f2933;
      --muted: #617080;
      --bg: #f6f8fa;
      --panel: #ffffff;
      --accent: #0b6bcb;
      --good: #137333;
      --warn: #9a5b00;
      --bad: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      font-weight: 650;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .topbar h1 { margin: 0; }
    .topbar a {
      color: var(--accent);
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
    }
    .topbar a:hover { text-decoration: underline; }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 90px 130px;
      gap: 10px;
      align-items: end;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      background: white;
    }
    textarea {
      min-height: 68px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .toggle {
      display: flex;
      gap: 8px;
      align-items: center;
      min-height: 39px;
      color: var(--ink);
      font-size: 14px;
    }
    .toggle input { width: auto; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 0;
    }
    .badge {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      background: #fff;
      color: var(--muted);
    }
    .badge.good { color: var(--good); border-color: #b8dfc2; }
    .badge.warn { color: var(--warn); border-color: #ecd49f; }
    .badge.bad { color: var(--bad); border-color: #f0b8b3; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      padding: 8px;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      background: #fbfcfd;
    }
    pre {
      overflow: auto;
      background: #101820;
      color: #dbeafe;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.45;
      max-height: 320px;
    }
    .small {
      color: var(--muted);
      font-size: 12px;
    }
    .error {
      color: var(--bad);
      margin-top: 10px;
      font-size: 13px;
      min-height: 18px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <div class="topbar">
    <h1>Demo vademecum QBI2 cache</h1>
    <a href="{% url 'qbi2_poc:medicamentos_directo' %}">Ver directo sin cache</a>
  </div>

  <div class="grid">
    <section class="panel">
      <div class="controls">
        <div>
          <label for="q">Buscar</label>
          <input id="q" type="search" autocomplete="off" placeholder="atorva, biso, los..." autofocus>
        </div>
        <div>
          <label for="page">Pagina</label>
          <input id="page" type="number" min="1" value="1">
        </div>
        <label class="toggle">
          <input id="allowStale" type="checkbox" checked>
          permitir stale
        </label>
      </div>

      <div style="margin-top: 10px;">
        <label for="extraParams">extra_params JSON opcional</label>
        <textarea id="extraParams" spellcheck="false" placeholder='{"foo":"bar"}'></textarea>
      </div>

      <div class="meta" id="statusBadges">
        <span class="badge">min {{ min_query_length }} caracteres</span>
        <span class="badge">debounce {{ debounce_ms }} ms</span>
      </div>
      <div id="error" class="error"></div>

      <table>
        <thead>
          <tr>
            <th>Display</th>
            <th>regNo</th>
            <th>Producto</th>
            <th>Droga</th>
            <th>Presentacion</th>
          </tr>
        </thead>
        <tbody id="results">
          <tr><td colspan="5" class="small">Escribi al menos {{ min_query_length }} caracteres.</td></tr>
        </tbody>
      </table>
    </section>

    <aside class="panel">
      <h2 style="font-size: 16px; margin: 0 0 10px;">Cache</h2>
      <pre id="cacheMeta">{}</pre>
      <h2 style="font-size: 16px; margin: 16px 0 10px;">Ultimas filas</h2>
      <div id="recent" class="small">Sin cargar.</div>
    </aside>
  </div>
</main>

<script>
  const minLength = {{ min_query_length }};
  const debounceMs = {{ debounce_ms }};
  const q = document.getElementById("q");
  const page = document.getElementById("page");
  const allowStale = document.getElementById("allowStale");
  const extraParams = document.getElementById("extraParams");
  const results = document.getElementById("results");
  const cacheMeta = document.getElementById("cacheMeta");
  const statusBadges = document.getElementById("statusBadges");
  const error = document.getElementById("error");
  const recent = document.getElementById("recent");
  let timer = null;
  let controller = null;

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#039;"
    }[char]));
  }

  function scheduleSearch() {
    clearTimeout(timer);
    timer = setTimeout(runSearch, debounceMs);
  }

  async function runSearch() {
    const text = q.value.trim();
    error.textContent = "";
    if (controller) controller.abort();

    if (text.length < minLength) {
      results.innerHTML = `<tr><td colspan="5" class="small">Minimo ${minLength} caracteres.</td></tr>`;
      cacheMeta.textContent = "{}";
      renderBadges({status: "too_short", hit: false, stale: false});
      return;
    }

    controller = new AbortController();
    const params = new URLSearchParams({
      q: text,
      page: page.value || "1",
      allow_stale: allowStale.checked ? "1" : "0",
      extra_params: extraParams.value.trim()
    });

    try {
      const response = await fetch(`/qbi2-poc/api/medicamentos/cache/?${params}`, {
        signal: controller.signal
      });
      const payload = await response.json();
      if (!payload.ok) {
        throw new Error(payload.error || "Error buscando vademecum");
      }
      renderResults(payload.data?.items || []);
      renderBadges(payload.cache || {});
      cacheMeta.textContent = JSON.stringify(payload.cache || {}, null, 2);
      loadRecent();
    } catch (exc) {
      if (exc.name === "AbortError") return;
      error.textContent = exc.message;
      renderBadges({status: "error", hit: false, stale: false});
    }
  }

  function renderBadges(cache) {
    const hitClass = cache.hit ? "good" : "";
    const staleClass = cache.stale ? "warn" : "";
    const statusClass = cache.status === "provider_error" || cache.status === "error" ? "bad" : "";
    statusBadges.innerHTML = `
      <span class="badge">min ${minLength} caracteres</span>
      <span class="badge">debounce ${debounceMs} ms</span>
      <span class="badge ${hitClass}">hit: ${Boolean(cache.hit)}</span>
      <span class="badge ${staleClass}">stale: ${Boolean(cache.stale)}</span>
      <span class="badge ${statusClass}">status: ${escapeHtml(cache.status || "-")}</span>
      <span class="badge">refresh: ${escapeHtml(cache.refresh || cache.refreshed_from_stale || "-")}</span>
    `;
  }

  function renderResults(items) {
    if (!items.length) {
      results.innerHTML = `<tr><td colspan="5" class="small">Sin resultados.</td></tr>`;
      return;
    }
    results.innerHTML = items.map(item => `
      <tr>
        <td>${escapeHtml(item.display)}</td>
        <td>${escapeHtml(item.regNo)}</td>
        <td>${escapeHtml(item.nombreProducto)}</td>
        <td>${escapeHtml(item.nombreDroga)}</td>
        <td>${escapeHtml(item.presentacion)}</td>
      </tr>
    `).join("");
  }

  async function loadRecent() {
    const response = await fetch("/qbi2-poc/api/cache/recientes/?limit=12");
    const payload = await response.json();
    recent.innerHTML = (payload.rows || []).map(row => `
      <div style="border-bottom: 1px solid var(--border); padding: 7px 0;">
        <strong>${escapeHtml(row.query)}</strong>
        <span>${escapeHtml(row.status)}</span>
        <span>${row.items} items</span><br>
        <span>fresh ${escapeHtml(row.fresh_until)}</span>
      </div>
    `).join("") || "Sin filas.";
  }

  q.addEventListener("input", scheduleSearch);
  page.addEventListener("input", scheduleSearch);
  allowStale.addEventListener("change", scheduleSearch);
  extraParams.addEventListener("input", scheduleSearch);
  loadRecent();
</script>
</body>
</html>
