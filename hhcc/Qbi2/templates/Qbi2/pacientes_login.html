{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso · Portal de pacientes</title>
    <style>
        :root { --blue:#175c91; --blue-dark:#0e3e64; --line:#c9deec; --text:#172b3a; --muted:#627786; }
        * { box-sizing:border-box; }
        body { background:linear-gradient(145deg,#e7f2fa,#f8fbfd); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; margin:0; }
        .page { align-items:center; display:flex; justify-content:center; min-height:100vh; padding:1rem; }
        .card { background:white; border:1px solid var(--line); border-radius:18px; box-shadow:0 22px 60px rgba(14,62,100,.13); max-width:28rem; padding:1.5rem; width:100%; }
        .logo { display:block; margin:0 auto 1.1rem; max-height:78px; max-width:220px; }
        h1 { color:var(--blue-dark); font-size:1.5rem; margin:0 0 .3rem; text-align:center; }
        .intro { color:var(--muted); margin:0 0 1.3rem; text-align:center; }
        label { color:var(--blue-dark); display:block; font-size:.82rem; font-weight:800; margin:.75rem 0 .3rem; }
        input { border:1px solid #b6cddd; border-radius:9px; font:inherit; min-height:2.8rem; padding:.55rem .7rem; width:100%; }
        button { background:var(--blue); border:0; border-radius:999px; color:white; cursor:pointer; font:inherit; font-weight:850; margin-top:1.15rem; min-height:2.8rem; width:100%; }
        .error { background:#fff1f1; border:1px solid #eccaca; border-radius:9px; color:#8b3030; font-weight:700; margin-bottom:.8rem; padding:.7rem .8rem; }
        .help { color:var(--muted); font-size:.78rem; line-height:1.4; margin:.9rem 0 0; }
    </style>
</head>
<body>
<main class="page">
    <section class="card">
        <img class="logo" src="{% static 'main/images/logo_omar_prieto.svg' %}" alt="Dr. Omar Prieto">
        <h1>Portal de pacientes</h1>
        <p class="intro">Ingresá para solicitar una receta.</p>
        {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="documento">Documento</label>
            <input id="documento" name="documento" value="{{ documento }}" inputmode="numeric" autocomplete="username" required autofocus>
            <label for="apellido">Apellido completo</label>
            <input id="apellido" name="apellido" value="{{ apellido }}" autocomplete="family-name" required>
            <button type="submit">Ingresar</button>
        </form>
        <p class="help">Si tu apellido es compuesto, escribilo completo tal como figura en tu historia clínica.</p>
    </section>
</main>
</body>
</html>
