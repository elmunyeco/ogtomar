{% comment %}
templates/components/header.html
{% endcomment %}

{% load static %}

<header class="header-container">
    <div class="header-main">
        <div class="logo-section">
            <a href="{% url 'index' %}" class="logo-link" aria-label="Ir al inicio">
                <img src="{% static 'main/images/logo.png' %}" alt="Logo Dr. Omar Prieto">
            </a>
            <div class="doctor-title">
                <span class="doctor-name">Dr. Omar Prieto</span>
                <span class="doctor-specialty">CARDIOLOGÍA INTEGRAL</span>
            </div>
        </div>
        <div class="user-actions">
            <div class="user-info">
                <a href="{% url 'cambiar_nombre' %}" class="user-name-link">{{ user.get_full_name|default:user.username }}</a>
            </div>
            <a href="{% url 'logout' %}" class="logout-btn">Cerrar Sesión</a>
        </div>
    </div>
    
    <nav class="main-nav">
        <ul class="main-menu">
            <li class="menu-item {% if active_section == 'pacientes' %}active{% endif %}" data-menu="pacientes">
                <a href="#" class="menu-link menu-toggle">Pacientes</a>
                <div class="submenu-items hidden">  <!-- Añadido 'hidden' aquí -->
                    <a href="{% url 'listar_buscar_pacientes' %}" class="submenu-link">Buscar Pacientes</a>
                    <a href="{% url 'crear_paciente' %}" class="submenu-link">Nuevo Paciente</a>
                </div>
            </li>
            
            <li class="menu-item {% if active_section == 'historias' %}active{% endif %}" data-menu="historias">
                <a href="#" class="menu-link menu-toggle">Historias</a>
                <div class="submenu-items hidden">
                    <a href="{% url 'listar_buscar_historias' %}" class="submenu-link">Buscar Historias</a>
                </div>
            </li>
        </ul>
        
    </nav>
</header>
