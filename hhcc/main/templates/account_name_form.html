{% extends "base.html" %}
{% load static %}

{% block title %}Cambiar nombre - Cardiología Integral{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-lg shadow-sm border border-gray-200 p-8">
        <div class="flex flex-col items-center mb-6">
            <img src="{% static 'main/images/logo.png' %}" alt="Logo" class="h-14 mb-3" />
            <h1 class="text-xl font-semibold text-[#9a4035]">Cambiar nombre</h1>
            <p class="text-xs text-gray-500">Cardiología Integral</p>
        </div>

        {% if mensaje %}
            <div class="mb-4 text-sm text-green-700 bg-green-50 border border-green-200 rounded p-3">
                {{ mensaje }}
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm text-gray-700 mb-1">Nombre</label>
                <input type="text" name="first_name" value="{{ user.first_name }}"
                    class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-1 focus:ring-[#9a4035]">
            </div>
            <div>
                <label class="block text-sm text-gray-700 mb-1">Apellido</label>
                <input type="text" name="last_name" value="{{ user.last_name }}"
                    class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-1 focus:ring-[#9a4035]">
            </div>
            <button type="submit"
                class="w-full py-2 bg-[#9a4035] text-white rounded-lg hover:bg-[#7a332b] transition-colors">
                Guardar
            </button>
        </form>
    </div>
</div>
{% endblock %}
