{% extends "base.html" %}

{% block title %}Paciente actualizado - Dr. Omar Prieto{% endblock %}

{% block content %}
<section style="margin: 3rem auto; max-width: 38rem; text-align: center;">
    <h1 style="font-size: 1.5rem; font-weight: 800;">Datos actualizados</h1>
    <p>Se guardaron los cambios de {{ paciente.nombre }} {{ paciente.apellido }}.</p>
    <p id="recipe-return-status">Volviendo a la receta…</p>
    <button type="button" onclick="returnToRecipe()" style="background:#9a4035;border:0;border-radius:999px;color:#fff;cursor:pointer;font-weight:800;padding:.75rem 1rem;">Volver a la receta</button>
</section>
{% endblock %}

{% block extra_js %}
<script>
    function returnToRecipe() {
        if (!window.opener || window.opener.closed) {
            document.getElementById("recipe-return-status").textContent = "La ventana de la receta ya no está disponible.";
            return;
        }
        window.opener.postMessage(
            {type: "hhcc:patient-updated", patientId: {{ paciente.id }}},
            window.location.origin
        );
        window.opener.focus();
        window.close();
    }
    returnToRecipe();
</script>
{% endblock %}
