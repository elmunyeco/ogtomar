services:
  db:
    image: nuevo_cardioprieto:latest
    container_name: nuevo_cardioprieto
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=Corbis5
    ports:
      - "3307:3306"
    mem_limit: 256m
    memswap_limit: 384m
    pids_limit: 128

  app:
    image: hhcc_app:latest
    container_name: hhcc_app
    restart: always
    depends_on:
      - db
    env_file:
      - .env.docker
    mem_limit: 192m
    memswap_limit: 256m
    pids_limit: 128

  nginx:
    image: nginx:alpine
    container_name: hhcc_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    mem_limit: 48m
    memswap_limit: 64m
    pids_limit: 64
